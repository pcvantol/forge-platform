name: macOS installer validation

on:
  pull_request:
    paths:
      - "macos/ForgePlatformInstaller/**"
      - ".github/workflows/macos-installer-validation.yml"
  push:
    branches: [main]
    paths:
      - "macos/ForgePlatformInstaller/**"
      - ".github/workflows/macos-installer-validation.yml"

permissions:
  contents: read

jobs:
  swift-package-tests:
    name: Swift installer-domain tests
    # Swift tools 6.0 requires Xcode 16+, which is the default toolchain on
    # the macos-15 hosted image.  macos-14 currently provides Swift 5.10.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Run native installer tests
        working-directory: macos/ForgePlatformInstaller
        run: swift test
